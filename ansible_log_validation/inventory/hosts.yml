---
# Inventory: the SFTP relay is the only remote host this playbook touches.
# Archer / SharePoint ERT are reached over HTTPS (API), not SSH, so they are
# not represented as Ansible-managed hosts.

all:
  children:
    sftp_relay:
      hosts:
        sftp01.dominionnet.example:
          ansible_user: "{{ vault_sftp_service_account }}"
          # Prefer key-based auth; password is a fallback only.
          ansible_ssh_private_key_file: "{{ vault_sftp_ssh_key_path }}"
          ansible_port: 22
