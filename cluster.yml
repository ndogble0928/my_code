
    # ═══════════════════════════════════════════════════════════════
    # CLUSTER — inside target_datacenter, environment + OS with fallback
    # ═══════════════════════════════════════════════════════════════
    - name: Inputs | Normalise SNOW values to tag codes
    ansible.builtin.set_fact:
    in_org: "{{ snow_org | trim | upper }}"
    in_location: "{{ location_map[snow_location | trim] | default('') }}"
    in_os: >-
      {{ 'Linux'   if (snow_os_variant | trim | lower) is match('rhel')
         else ('Windows' if (snow_os_variant | trim | lower) is match('windows')
         else '') }}
    
    - name: Cluster | Build the environment fallback ladder
      ansible.builtin.set_fact:
        cl_env_ladder: "{{ env_ladders[snow_environment] }}"
      vars:
        env_ladders:
          Prod: [Prod, Default]
          QA:   [QA, NonProd, Default]
          Dev:  [Dev, NonProd, Default]
          Test: [NonProd, QA, Default]
 
    - name: Cluster | Gather clusters in {{ target_datacenter }} with tags
      community.vmware.vmware_cluster_info:
        datacenter: "{{ target_datacenter }}"
        show_tag: true
      register: cl_info
 
    - name: Cluster | Show raw module output (visible with -v)
      ansible.builtin.debug:
        var: cl_info.clusters
        verbosity: 1
 
    - name: Cluster | Flatten to name + tag names, drop untagged
      ansible.builtin.set_fact:
        cl_map: >-
          {{ cl_info.clusters | dict2items
             | json_query('[].{name: key, tags: value.tags[].name}')
             | selectattr('tags') | list }}
        cl_matches: []
 
    - name: Cluster | Try each tier in priority order until one matches
      ansible.builtin.set_fact:
        cl_matches: >-
          {{ cl_map
             | selectattr('tags', 'contains', 'Cluster_Environment_' ~ item.0)
             | selectattr('tags', 'contains', 'Cluster_OS_' ~ item.1)
             | map(attribute='name') | list }}
        cl_tier: "{{ item.0 }} / {{ item.1 }}"
      loop: "{{ cl_env_ladder | product([in_os, 'Default']) | list }}"
      loop_control:
        label: "env={{ item.0 }} os={{ item.1 }}"
      when: cl_matches | length == 0
 
    - name: Cluster | Fail — no match
      ansible.builtin.fail:
        msg: >-
          No cluster in {{ target_datacenter }} tagged for
          environment {{ snow_environment }} (tried {{ cl_env_ladder | join(', ') }})
          and OS {{ in_os }} (or Default).
      when: cl_matches | length == 0
 
    - name: Cluster | Fail — ambiguous match
      ansible.builtin.fail:
        msg: >-
          {{ cl_matches | length }} clusters in {{ target_datacenter }} matched
          tier {{ cl_tier }}: {{ cl_matches | join(', ') }}.
          Expected exactly one — check cluster tags.
      when: cl_matches | length > 1
 
    - name: Cluster | Set result
      ansible.builtin.set_fact:
        target_cluster: "{{ cl_matches | first }}"

    # ═══════════════════════════════════════════════════════════════
    # DATASTORE — scoped to target_cluster, filtered by one build tag
    #
    # Scoping to the cluster already settles environment and OS: a
    # cluster only sees the storage mounted to its hosts. The tag just
    # separates general build storage from local / special-purpose LUNs.
    #
    # Datastore clusters (-DSC) cannot be tag-read by community.vmware,
    # so the tag sits on their MEMBER datastores. Output is the parent
    # pod name when the match is in a pod, else the datastore name —
    # both forms are accepted by create_vm's datastore.yml.j2.
    # ═══════════════════════════════════════════════════════════════
 
    - name: Datastore | Gather datastores visible to {{ target_cluster }} with tags
      community.vmware.vmware_datastore_info:
        datacenter: "{{ target_datacenter }}"
        cluster: "{{ target_cluster }}"
        show_tag: true
      register: ds_info
 
    - name: Datastore | Show raw module output (visible with -v)
      ansible.builtin.debug:
        var: ds_info.datastores
        verbosity: 1
 
    - name: Datastore | Keep only datastores tagged for builds
      ansible.builtin.set_fact:
        ds_build: >-
          {{ ds_info.datastores
             | json_query('[].{name: name, pod: datastore_cluster, tags: tags[].name}')
             | selectattr('tags')
             | selectattr('tags', 'contains', 'Datastore_Placement_Build')
             | list }}
 
    - name: Datastore | Collapse members to their parent pod
      ansible.builtin.set_fact:
        ds_targets: >-
          {%- set out = [] -%}
          {%- for d in ds_build -%}
            {%- set in_pod = d.pod is string and d.pod not in ['', 'N/A'] -%}
            {%- set _ = out.append(d.pod if in_pod else d.name) -%}
          {%- endfor -%}
          {{ out | unique | list }}
 
    - name: Datastore | Fail — no match
      ansible.builtin.fail:
        msg: >-
          No datastore tagged Datastore_Placement_Build is visible to
          cluster {{ target_cluster }} in {{ target_datacenter }}.
      when: ds_targets | length == 0
 
    - name: Datastore | Fail — ambiguous match
      ansible.builtin.fail:
        msg: >-
          Cluster {{ target_cluster }} sees {{ ds_targets | length }} build
          targets: {{ ds_targets | join(', ') }}. Expected exactly one —
          either untag the extra storage or add environment/OS tags.
      when: ds_targets | length > 1
 
    - name: Datastore | Set result
      ansible.builtin.set_fact:
        target_datastore: "{{ ds_targets | first }}"
